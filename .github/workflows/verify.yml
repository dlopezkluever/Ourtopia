name: Verify
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  issue-2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm run verify:secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start > /tmp/ourtopia-backend.log 2>&1
      - run: node scripts/verify/local-env.mjs
      - run: node scripts/verify/migrations.mjs --disposable-project ourtopia-issue-2
      - run: npm run test:server -- tests/server/issue-2.test.ts
      - run: npm run test:server -- tests/server/issue-3.test.ts
      - run: npm run test:server -- tests/server/issue-4.test.ts
      - run: npm run test:server -- tests/server/issue-5.test.ts
      - run: npm run test:server -- tests/server/issue-15.test.ts
      - run: npm run test:server -- tests/server/issue-12.test.ts
      - run: npm run test:server -- tests/server/issue-6.test.ts
      - run: npm run test:rls -- tests/rls/issue-2.test.ts
      - run: npm run test:rls -- tests/rls/issue-3.test.ts
      - run: npm run test:rls -- tests/rls/issue-4.test.ts
      - run: npm run test:rls -- tests/rls/issue-5.test.ts
      - run: npm run test:rls -- tests/rls/issue-15.test.ts
      - run: npm run test:rls -- tests/rls/issue-12.test.ts
      - run: npm run test:rls -- tests/rls/issue-6.test.ts
      - run: npm run test:journey -- tests/journeys/issue-2.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-3.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-4.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-5.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-15.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-12.spec.ts
      - run: npm run test:journey -- tests/journeys/issue-6.spec.ts
      - run: npm run verify:perf -- --issue 2 --base 2af28e7a06db971e8e5fbbf01b0b8bda07f81c76 --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 3 --base a0eff460f5707d128141857d275f21c1a111ac1c --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 4 --base 3f5f3fd0293421cc2688576acfc8d742e676dc4c --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 5 --base e246904e579ef4231dd90e62be01f5c6f9abfd65 --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 15 --base 714ebbd222b19be1e6ca0457bb1bd82a232e8a6b --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 12 --base 26e3bb37c7dbc7f14bdf95a36c8cd4b838dba413 --head $(git rev-parse HEAD) --pairs 10
      - run: npm run verify:perf -- --issue 6 --base 998b29ade3134035cf627dc1a1a8ee07cd504ab0 --head $(git rev-parse HEAD) --pairs 10
      - if: always()
        run: npx supabase stop --project-id ourtopia-issue-2
